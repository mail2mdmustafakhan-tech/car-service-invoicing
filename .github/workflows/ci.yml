# Continuous integration.
#
# What this does, in plain terms: every time you push code to GitHub, or open
# a pull request, GitHub rents a fresh computer, installs this project on it,
# runs the linter and the whole test suite, and shows a green tick or a red
# cross next to your commit.
#
# You do not have to set anything up. The file being here is enough -- GitHub
# finds it automatically. If the cross appears, click it to read what failed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

# If you push twice in quick succession, the older run is abandoned rather
# than left burning minutes on code you have already replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      # Tested against several Python versions so the project keeps working
      # whichever one is installed on the machine at the service centre.
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Note what is deliberately NOT here: the Pango and Cairo system
      # libraries that WeasyPrint needs. Installing them with apt on a rented
      # runner failed intermittently (apt exit code 100, a stale package
      # index) and took the whole run red for a reason that had nothing to do
      # with this code. The tests do not need them: app/pdf.py treats
      # WeasyPrint as optional and falls back to the browser's own print
      # dialogue, so the suite runs either way. The Docker job below is where
      # PDF rendering is actually proved, which is also where it has to work.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check code style
        run: ruff check .

      - name: Run tests
        run: pytest

  docker:
    name: Build the Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t car-service-invoicing:ci .

      # Proves the PDF libraries really are in the image. This is the check
      # that matters: PDF download is a Docker-only feature, so this is the
      # only place it has to work.
      - name: Check PDF rendering works inside the image
        run: |
          docker run --rm car-service-invoicing:ci python -c \
            "import weasyprint; print('WeasyPrint', weasyprint.__version__, 'ready')"

      # Starting the container proves the image actually runs, not just that
      # it builds -- a missing system library only shows up at start-up.
      - name: Start it and check it answers
        run: |
          docker run -d --name ci-check -p 8000:8000 car-service-invoicing:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo ""
              echo "Container is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy. Logs:"
          docker logs ci-check
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f ci-check || true
