<?xml version="1.0" encoding="UTF-8"?>
<!--
  Advance Repair Center (ARC) — emblem, redrawn as vector artwork.

  Reconstructed from a photograph of the workshop's printed contract. Every
  measurement derives from four numbers, so the mark holds its proportions at
  any size and both letters carry identical stroke weight:

      centre   (500, 560)
      ring     outer radius 330, band 62 wide
      letters  stroke 60, kept clear of the ring by a 24-wide gap
      stem     shared by both letters, cutting the ring top and bottom

  The counters are triangular, as in the original: the A's leg is a true
  diagonal running up to the stem, and the R's bowl is faceted, not round.

  The Arabic is set in Noto Kufi Arabic, whose geometry suits a circular
  emblem. Swap the font-family list if the workshop has a house font.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"
     width="1000" height="1000" role="img"
     aria-label="Advance Repair Center emblem" xmlns:c2pa="http://c2pa.org/manifest">

  <title>Advance Repair Center (ARC)</title>

  <defs>
    <style>
      .ink   { fill: none; stroke: #26307E; }
      .solid { fill: #26307E; }
      .cut   { fill: #FFFFFF; }
      .ar {
        fill: #26307E;
        font-family: "Noto Kufi Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
        font-size: 66px;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Arabic arc, clear of the ring: مركز الاصلاح المتقدم -->
  <path id="arc" d="M 122 560 A 378 378 0 0 1 878 560" fill="none"/>
  <text class="ar" text-anchor="middle" direction="rtl">
    <textPath href="#arc" startOffset="50%">مركز الاصلاح المتقدم</textPath>
  </text>

  <!-- The ring -->
  <circle class="ink" cx="500" cy="560" r="299" stroke-width="62"/>

  <!-- The ring is cut away either side of the stem rather than merging into
       it. That gap is what gives the mark its stamped-seal look. -->
  <rect class="cut" x="452" y="216" width="96" height="88"/>
  <rect class="cut" x="452" y="816" width="96" height="88"/>

  <!-- Shared stem, descending through the bottom of the ring -->
  <rect class="solid" x="470" y="232" width="60" height="698"/>

  <g class="ink" stroke-width="60" stroke-linecap="butt" stroke-linejoin="round">
    <!-- A: diagonal leg up to the stem, horizontal crossbar -->
    <path d="M 348 706 L 470 436"/>
    <path d="M 372 580 H 470"/>

    <!-- R: faceted bowl springing off the stem, then the leg -->
    <path d="M 530 432 H 612 L 658 502 L 612 572 H 530"/>
    <path d="M 604 562 L 658 688"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
